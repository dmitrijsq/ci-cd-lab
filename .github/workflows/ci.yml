name: CI-Bad
on: [push]

jobs:
  build:
    # BAD: Запускаем на убунту (latest image внутри экшена)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # BAD: Хардкод Node.js latest через установку вручную или отсутствие фиксации
      - name: Install dependencies
        # BAD: Нет кэша, качаем всё заново
        run: npm install

      - name: Test
        # BAD: Игнорируем ошибки (аналог allow_failure)
        run: npm test || true

      - name: Deploy
        run: |
          # BAD: Отключаем проверку SSL
          export GIT_SSL_NO_VERIFY=1
          # BAD: Хардкод пароля
          echo "Deploying with password: supersecretpassword123"
